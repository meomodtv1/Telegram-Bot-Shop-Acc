name = "telegram-shop-bot"
main = "src/index.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]

# Static assets cho CMS (dist/cms) + Mini App (dist/miniapp)
# Bucket = ./dist nên KV key có prefix theo thư mục con: cms/..., miniapp/...
[site]
bucket = "./dist"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "telegram-shop-bot-db"
database_id = ""d1_databases": [{
    "binding": "DB",
    "database_name": "telegram-shop-bot-db",
    "database_id": "da3e05a2-33f6-49e9-ba17-6cf1988c9f52"
 }]"
migrations_dir = "migrations"

[triggers]
crons = ["*/15 * * * *"]  # Expire pending deposits mỗi 15 phút

# Secrets (set via `wrangler secret put`):
# BOT_TOKEN
# TELEGRAM_SECRET_TOKEN
# SEPAY_API_KEY
# ADMIN_IDS
# JWT_SECRET
# BANK_NAME
# BANK_ACCOUNT
# BANK_OWNER
